<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0507">
  <title>東京喰種 スマスロシミュレーター</title>

  <style>
    :root {
      color-scheme: dark;
      --bg-top: #1b080c;
      --bg-bottom: #050608;
      --panel: #17191f;
      --panel-2: #20232b;
      --border: #3a3d46;
      --text: #ffffff;
      --muted: #a8aab2;
      --red: #d52b36;
      --red-dark: #701018;
      --green: #5fe08a;
      --yellow: #ffd264;
      --blue: #67a7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(var(--bg-top), var(--bg-bottom));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(100%, 560px);
      min-height: 100vh;
      margin: auto;
      padding:
        max(18px, env(safe-area-inset-top))
        14px
        max(36px, env(safe-area-inset-bottom));
    }

    h1 {
      margin: 5px 0 2px;
      text-align: center;
      font-size: 28px;
    }

    .version {
      margin: 0 0 14px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .status,
    .counters,
    .normal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .counters,
    .normal-panel {
      margin-top: 8px;
    }

    .status-box,
    .counter-box,
    .normal-box {
      padding: 10px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .status-box small,
    .counter-box small,
    .normal-box small {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .status-box strong,
    .counter-box strong,
    .normal-box strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
    }

    .counter-box strong.positive {
      color: var(--green);
    }

    .counter-box strong.negative {
      color: #ff7b83;
    }

    .normal-panel {
      padding: 10px;
      background: rgba(23, 25, 31, 0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .normal-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .mode-badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: #30333b;
      border: 1px solid #555;
      font-size: 13px;
    }

    .point-row {
      margin-top: 9px;
    }

    .point-label {
      display: flex;
      justify-content: space-between;
      color: #ddd;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .point-track {
      height: 12px;
      overflow: hidden;
      background: #090a0d;
      border: 1px solid #454952;
      border-radius: 999px;
    }

    .point-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #5d1c2c, #e93a50, #ffd264);
      transition: width 0.25s ease;
    }

    .display {
      min-height: 104px;
      display: grid;
      place-items: center;
      margin: 10px 0;
      padding: 12px;
      text-align: center;
      white-space: pre-line;
      line-height: 1.45;
      background: linear-gradient(135deg, #351017, #11141a);
      border: 1px solid #7d252e;
      border-radius: 14px;
      font-weight: 700;
    }

    .reels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      padding: 8px;
      background: #050505;
      border: 2px solid #555;
      border-radius: 15px;
    }

    .reel {
      overflow: hidden;
      background: white;
      color: #111;
      border: 2px solid #777;
      border-radius: 9px;
    }

    .symbol {
      height: 58px;
      display: grid;
      place-items: center;
      border-bottom: 1px solid #bbb;
      font-size: 31px;
      user-select: none;
    }

    .symbol:nth-child(2) {
      height: 78px;
      font-size: 42px;
      font-weight: 800;
      background: #fff;
    }

    .symbol:last-child {
      border-bottom: none;
    }

    .reel.spinning {
      opacity: 0.6;
      filter: blur(1px);
    }

    .stop-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .stop-button {
      height: 62px;
      color: white;
      background: var(--panel-2);
      border: 2px solid #666;
      border-radius: 50%;
      font-weight: 800;
    }

    .stop-button:disabled {
      opacity: 0.25;
    }

    .stop-button:not(:disabled):active {
      background: #8c1720;
      transform: scale(0.94);
    }

    .lever {
      width: 100%;
      min-height: 65px;
      margin-top: 14px;
      color: white;
      background: linear-gradient(var(--red), var(--red-dark));
      border: 1px solid #ff6971;
      border-radius: 15px;
      font-size: 21px;
      font-weight: 800;
    }

    .lever:disabled {
      opacity: 0.4;
    }

    .sub-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .sub-controls button {
      min-height: 46px;
      padding: 10px;
      color: white;
      background: var(--panel-2);
      border: 1px solid #555;
      border-radius: 10px;
      font-weight: 700;
    }

    .sub-controls button:active {
      transform: scale(0.98);
    }

    .info {
      margin-top: 12px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
    }

    .bet-note {
      color: var(--yellow);
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>東京喰種</h1>
    <p class="version">スマスロシミュレーター Ver.0.4</p>

    <section class="status">
      <div class="status-box">
        <small>状態</small>
        <strong id="status">通常時</strong>
      </div>

      <div class="status-box">
        <small>ゲーム数</small>
        <strong id="games">0G</strong>
      </div>
    </section>

    <section class="counters">
      <div class="counter-box">
        <small>クレジット</small>
        <strong id="credit">50枚</strong>
      </div>

      <div class="counter-box">
        <small>今回の投入</small>
        <strong id="bet">0枚</strong>
      </div>

      <div class="counter-box">
        <small>今回の払い出し</small>
        <strong id="payout">0枚</strong>
      </div>

      <div class="counter-box">
        <small>差枚数</small>
        <strong id="difference">0枚</strong>
      </div>
    </section>

    <section class="normal-panel">
      <div class="normal-title">
        <span>通常時システム</span>
        <span class="mode-badge" id="modeBadge">通常A</span>
      </div>

      <div class="normal-grid">
        <div class="normal-box">
          <small>CZポイント</small>
          <strong id="czPoints">0pt</strong>
        </div>

        <div class="normal-box">
          <small>CZ回数</small>
          <strong id="czCount">0回</strong>
        </div>

        <div class="normal-box">
          <small>CZ情報</small>
          <strong id="czInfo">--</strong>
        </div>

        <div class="normal-box">
          <small>モード滞在</small>
          <strong id="modeGames">0G</strong>
        </div>
      </div>

      <div class="point-row">
        <div class="point-label">
          <span>100ptでCZ確定</span>
          <span id="pointPercent">0%</span>
        </div>
        <div class="point-track">
          <div class="point-bar" id="pointBar"></div>
        </div>
      </div>
    </section>

    <section class="display" id="message">
      レバーONでスタート
    </section>

    <section class="reels" aria-label="3リール">
      <div class="reel" id="reel0">
        <div class="symbol"></div>
        <div class="symbol"></div>
        <div class="symbol"></div>
      </div>

      <div class="reel" id="reel1">
        <div class="symbol"></div>
        <div class="symbol"></div>
        <div class="symbol"></div>
      </div>

      <div class="reel" id="reel2">
        <div class="symbol"></div>
        <div class="symbol"></div>
        <div class="symbol"></div>
      </div>
    </section>

    <section class="stop-buttons">
      <button class="stop-button" id="stop0" disabled>左</button>
      <button class="stop-button" id="stop1" disabled>中</button>
      <button class="stop-button" id="stop2" disabled>右</button>
    </section>

    <button class="lever" id="lever">レバーON（3枚BET）</button>

    <section class="sub-controls">
      <button id="addCredit">クレジット＋50枚</button>
      <button id="reset">最初からやり直す</button>
    </section>

    <section class="info">
      <span class="bet-note">Ver.0.4：通常モード・CZポイント・CZ抽選を追加</span><br>
      レア役でCZポイントを獲得<br>
      100pt到達、またはレア役の直撃抽選でCZへ<br>
      CZは8G、100pt到達で成功<br>
      ※モード名・抽選値・払い出しは現在テスト用
    </section>
  </main>

  <script>
    "use strict";

    const BET_PER_GAME = 3;
    const STARTING_CREDIT = 50;
    const CZ_TARGET_POINTS = 100;
    const CZ_LENGTH = 8;

    const reelData = [
      [
        "🍉","🍒","⬜","🟦","🔔",
        "🍉","🟥","🌸","🟦","🔔",
        "🍉","🍒","🐦‍⬛","🟦","🔔",
        "🍉","🍒","7️⃣","🟦","🔔"
      ],
      [
        "🟥","🟦","⬜","🍒","🔔",
        "🟥","🟦","🌸","🍉","🔔",
        "🟥","🟦","🐦‍⬛","🍉","🔔",
        "🟥","🟦","7️⃣","🍒","🔔"
      ],
      [
        "🔔","🟦","⬜","🟥","🍉",
        "🔔","🟦","🌸","🟥","🍉",
        "🔔","🟦","🐦‍⬛","🟥","🍉",
        "🔔","🟦","7️⃣","🟥","🍉"
      ]
    ];

    const roleTable = [
      {
        name: "ベル",
        weight: 42,
        target: ["🔔", "🔔", "🔔"],
        payout: 9,
        normalPoints: [0, 2],
        directCzChance: 0,
        czPower: 6
      },
      {
        name: "リプレイ",
        weight: 28,
        target: ["🟦", "🟦", "🟦"],
        payout: 3,
        normalPoints: [0, 1],
        directCzChance: 0,
        czPower: 4
      },
      {
        name: "チェリー",
        weight: 12,
        target: ["🍒", null, null],
        payout: 2,
        normalPoints: [10, 20],
        directCzChance: 0.05,
        czPower: 22
      },
      {
        name: "スイカ",
        weight: 8,
        target: ["🍉", "🍉", "🍉"],
        payout: 4,
        normalPoints: [15, 30],
        directCzChance: 0.1,
        czPower: 28
      },
      {
        name: "赫図柄",
        weight: 4,
        target: ["🟥", "🟥", "🟥"],
        payout: 15,
        normalPoints: [30, 50],
        directCzChance: 0.25,
        czPower: 45
      },
      {
        name: "喰図柄",
        weight: 1,
        target: ["🌸", "🌸", "🌸"],
        payout: 15,
        normalPoints: [100, 100],
        directCzChance: 1,
        czPower: 100
      },
      {
        name: "白7",
        weight: 0.2,
        target: ["7️⃣", "7️⃣", "7️⃣"],
        payout: 15,
        normalPoints: [100, 100],
        directCzChance: 1,
        czPower: 100
      },
      {
        name: "ハズレ",
        weight: 4.8,
        target: [null, null, null],
        payout: 0,
        normalPoints: [0, 0],
        directCzChance: 0,
        czPower: 0
      }
    ];

    const modes = [
      {
        name: "通常A",
        pointMultiplier: 1,
        directMultiplier: 1,
        color: "#81858f"
      },
      {
        name: "通常B",
        pointMultiplier: 1.15,
        directMultiplier: 1.2,
        color: "#67a7ff"
      },
      {
        name: "チャンス",
        pointMultiplier: 1.35,
        directMultiplier: 1.6,
        color: "#ffd264"
      },
      {
        name: "高確",
        pointMultiplier: 1.6,
        directMultiplier: 2.2,
        color: "#ff6b7b"
      }
    ];

    const positions = [12, 12, 12];
    const timers = [null, null, null];
    const stopped = [true, true, true];

    const lever = document.getElementById("lever");
    const statusText = document.getElementById("status");
    const gamesText = document.getElementById("games");
    const message = document.getElementById("message");
    const creditText = document.getElementById("credit");
    const betText = document.getElementById("bet");
    const payoutText = document.getElementById("payout");
    const differenceText = document.getElementById("difference");
    const modeBadge = document.getElementById("modeBadge");
    const czPointsText = document.getElementById("czPoints");
    const czCountText = document.getElementById("czCount");
    const czInfoText = document.getElementById("czInfo");
    const modeGamesText = document.getElementById("modeGames");
    const pointPercentText = document.getElementById("pointPercent");
    const pointBar = document.getElementById("pointBar");

    const stopButtons = [
      document.getElementById("stop0"),
      document.getElementById("stop1"),
      document.getElementById("stop2")
    ];

    let games = 0;
    let playing = false;
    let credit = STARTING_CREDIT;
    let totalIn = 0;
    let totalOut = 0;
    let currentBet = 0;
    let lastPayout = 0;
    let currentRole = roleTable[roleTable.length - 1];

    let gameState = "normal";
    let pendingCz = false;
    let currentModeIndex = 0;
    let modeGames = 0;
    let czPoints = 0;
    let czCount = 0;
    let czGamesLeft = 0;
    let czBattlePoints = 0;

    function wrap(number, length) {
      return ((number % length) + length) % length;
    }

    function randomInteger(minimum, maximum) {
      return Math.floor(
        Math.random() * (maximum - minimum + 1)
      ) + minimum;
    }

    function drawReel(index) {
      const reel = document.getElementById("reel" + index);
      const symbols = reel.querySelectorAll(".symbol");
      const data = reelData[index];
      const position = positions[index];

      symbols[0].textContent =
        data[wrap(position - 1, data.length)];

      symbols[1].textContent = data[position];

      symbols[2].textContent =
        data[wrap(position + 1, data.length)];

      reel.classList.toggle("spinning", !stopped[index]);
    }

    function drawAll() {
      drawReel(0);
      drawReel(1);
      drawReel(2);
    }

    function updateCounters() {
      const difference = totalOut - totalIn;

      creditText.textContent = credit + "枚";
      betText.textContent = currentBet + "枚";
      payoutText.textContent = lastPayout + "枚";
      differenceText.textContent =
        (difference > 0 ? "+" : "") + difference + "枚";

      differenceText.classList.toggle(
        "positive",
        difference > 0
      );

      differenceText.classList.toggle(
        "negative",
        difference < 0
      );

      lever.disabled = playing || credit < BET_PER_GAME;
    }

    function updateNormalDisplay() {
      const mode = modes[currentModeIndex];
      const displayedPoints = Math.min(czPoints, CZ_TARGET_POINTS);
      const percent = Math.floor(
        displayedPoints / CZ_TARGET_POINTS * 100
      );

      modeBadge.textContent = mode.name;
      modeBadge.style.color = mode.color;
      modeBadge.style.borderColor = mode.color;

      czPointsText.textContent = displayedPoints + "pt";
      czCountText.textContent = czCount + "回";
      modeGamesText.textContent = modeGames + "G";
      pointPercentText.textContent = percent + "%";
      pointBar.style.width = percent + "%";

      if (gameState === "cz") {
        czInfoText.textContent =
          "残" + czGamesLeft + "G / " + czBattlePoints + "pt";
        statusText.textContent = "CZ中";
      } else if (pendingCz) {
        czInfoText.textContent = "次G突入";
        statusText.textContent = "CZ前兆";
      } else {
        czInfoText.textContent = "--";
        statusText.textContent = playing ? "回転中" : "通常時";
      }
    }

    function selectRole() {
      const totalWeight = roleTable.reduce(
        (total, role) => total + role.weight,
        0
      );

      let random = Math.random() * totalWeight;

      for (const role of roleTable) {
        random -= role.weight;

        if (random < 0) {
          return role;
        }
      }

      return roleTable[roleTable.length - 1];
    }

    function selectModeIndex() {
      const roll = Math.random();

      if (roll < 0.48) return 0;
      if (roll < 0.78) return 1;
      if (roll < 0.95) return 2;
      return 3;
    }

    function maybeChangeMode(role) {
      let changeChance = 0.045;

      if (role.name === "チェリー") changeChance += 0.08;
      if (role.name === "スイカ") changeChance += 0.12;
      if (role.name === "赫図柄") changeChance += 0.22;

      if (modeGames >= 50) {
        changeChance += 0.25;
      }

      if (Math.random() < changeChance) {
        const oldMode = currentModeIndex;
        currentModeIndex = selectModeIndex();
        modeGames = 0;

        if (currentModeIndex !== oldMode) {
          return "モード移行：" + modes[currentModeIndex].name;
        }
      }

      return "";
    }

    function findTargetPosition(
      reelIndex,
      targetSymbol,
      maximumSlip
    ) {
      const data = reelData[reelIndex];
      const startPosition = positions[reelIndex];

      if (targetSymbol === null) {
        return startPosition;
      }

      for (let slip = 0; slip <= maximumSlip; slip++) {
        const checkPosition = wrap(
          startPosition + slip,
          data.length
        );

        if (data[checkPosition] === targetSymbol) {
          return checkPosition;
        }
      }

      return startPosition;
    }

    function beginCz() {
      gameState = "cz";
      pendingCz = false;
      czGamesLeft = CZ_LENGTH;
      czBattlePoints = 0;
      czPoints = 0;
      czCount++;
      updateNormalDisplay();
    }

    function startGame() {
      if (playing) {
        return;
      }

      if (credit < BET_PER_GAME) {
        message.textContent =
          "クレジット不足です\n＋50枚を押してください";
        updateCounters();
        return;
      }

      if (pendingCz) {
        beginCz();
      }

      playing = true;
      games++;
      currentRole = selectRole();
      currentBet = BET_PER_GAME;
      lastPayout = 0;

      credit -= BET_PER_GAME;
      totalIn += BET_PER_GAME;

      if (gameState === "normal") {
        modeGames++;
      }

      gamesText.textContent = games + "G";
      message.textContent =
        gameState === "cz"
          ? "CZ中：左リールから停止"
          : "左リールから停止";

      stopButtons[0].disabled = false;
      stopButtons[1].disabled = true;
      stopButtons[2].disabled = true;

      updateCounters();
      updateNormalDisplay();

      reelData.forEach((data, index) => {
        stopped[index] = false;

        timers[index] = setInterval(() => {
          positions[index] = wrap(
            positions[index] + 1,
            data.length
          );

          drawReel(index);
        }, 55 + index * 7);
      });
    }

    function stopReel(index) {
      if (stopped[index]) {
        return;
      }

      clearInterval(timers[index]);
      timers[index] = null;
      stopped[index] = true;

      let targetSymbol = currentRole.target[index];

      if (
        index === 0 &&
        currentRole.name === "ハズレ"
      ) {
        targetSymbol = "🐦‍⬛";
      }

      const specialRole =
        currentRole.name === "喰図柄" ||
        currentRole.name === "白7";

      const maximumSlip = specialRole ? 19 : 4;

      positions[index] = findTargetPosition(
        index,
        targetSymbol,
        maximumSlip
      );

      drawReel(index);
      stopButtons[index].disabled = true;

      if (index === 0) {
        stopButtons[1].disabled = false;
        message.textContent = "次は中リール";
        return;
      }

      if (index === 1) {
        stopButtons[2].disabled = false;
        message.textContent = "最後に右リール";
        return;
      }

      finishGame();
    }

    function getMiddleLine() {
      return positions.map((position, index) => {
        return reelData[index][position];
      });
    }

    function roleWasDisplayed(line) {
      if (currentRole.name === "ハズレ") {
        return true;
      }

      if (currentRole.name === "チェリー") {
        return line[0] === "🍒";
      }

      const targetSymbol = currentRole.target[0];

      return line.every(symbol => {
        return symbol === targetSymbol;
      });
    }

    function processNormalGame(success) {
      if (!success) {
        return "CZポイント：取りこぼしで獲得なし";
      }

      const mode = modes[currentModeIndex];
      const basePoints = randomInteger(
        currentRole.normalPoints[0],
        currentRole.normalPoints[1]
      );
      const gainedPoints = Math.round(
        basePoints * mode.pointMultiplier
      );

      czPoints = Math.min(
        CZ_TARGET_POINTS,
        czPoints + gainedPoints
      );

      const directChance = Math.min(
        1,
        currentRole.directCzChance * mode.directMultiplier
      );

      const directHit = Math.random() < directChance;
      const pointHit = czPoints >= CZ_TARGET_POINTS;

      let result = "CZポイント：+" + gainedPoints + "pt";

      if (directHit || pointHit) {
        pendingCz = true;
        result += directHit
          ? "\nレア役直撃でCZ当選！"
          : "\n100pt到達でCZ当選！";
      } else {
        const modeMessage = maybeChangeMode(currentRole);

        if (modeMessage) {
          result += "\n" + modeMessage;
        }
      }

      return result;
    }

    function processCzGame(success) {
      const gained = success ? currentRole.czPower : 0;
      czBattlePoints = Math.min(
        CZ_TARGET_POINTS,
        czBattlePoints + gained
      );
      czGamesLeft--;

      let result = "CZ獲得：+" + gained + "pt";

      if (czBattlePoints >= CZ_TARGET_POINTS) {
        result += "\nCZ成功！AT当選（AT処理は次版）";
        gameState = "normal";
        czGamesLeft = 0;
        czBattlePoints = 0;
        currentModeIndex = selectModeIndex();
        modeGames = 0;
        return result;
      }

      if (czGamesLeft <= 0) {
        result += "\nCZ失敗…通常時へ";
        gameState = "normal";
        czBattlePoints = 0;
        currentModeIndex = selectModeIndex();
        modeGames = 0;
      } else {
        result +=
          "\n残り" + czGamesLeft + "G / " +
          czBattlePoints + "pt";
      }

      return result;
    }

    function finishGame() {
      const line = getMiddleLine();
      const success = roleWasDisplayed(line);

      lastPayout = success ? currentRole.payout : 0;
      credit += lastPayout;
      totalOut += lastPayout;

      const systemMessage =
        gameState === "cz"
          ? processCzGame(success)
          : processNormalGame(success);

      playing = false;
      statusText.textContent = "停止";

      if (
        currentRole.name !== "ハズレ" &&
        !success
      ) {
        message.textContent =
          "成立役：" +
          currentRole.name +
          "（取りこぼし）\n払い出し：0枚\n" +
          systemMessage + "\n" +
          line.join(" ｜ ");
      } else {
        message.textContent =
          "成立役：" +
          currentRole.name +
          "\n払い出し：" +
          lastPayout +
          "枚\n" +
          systemMessage + "\n" +
          line.join(" ｜ ");
      }

      updateCounters();
      updateNormalDisplay();
    }

    function addCredit() {
      if (playing) {
        return;
      }

      credit += 50;
      message.textContent = "クレジットを50枚補充しました";
      updateCounters();
    }

    function resetGame() {
      timers.forEach(timer => {
        if (timer !== null) {
          clearInterval(timer);
        }
      });

      positions[0] = 12;
      positions[1] = 12;
      positions[2] = 12;

      stopped[0] = true;
      stopped[1] = true;
      stopped[2] = true;

      games = 0;
      playing = false;
      credit = STARTING_CREDIT;
      totalIn = 0;
      totalOut = 0;
      currentBet = 0;
      lastPayout = 0;

      gameState = "normal";
      pendingCz = false;
      currentModeIndex = 0;
      modeGames = 0;
      czPoints = 0;
      czCount = 0;
      czGamesLeft = 0;
      czBattlePoints = 0;

      gamesText.textContent = "0G";
      message.textContent = "レバーONでスタート";

      stopButtons.forEach(button => {
        button.disabled = true;
      });

      drawAll();
      updateCounters();
      updateNormalDisplay();
    }

    lever.addEventListener("click", startGame);

    stopButtons[0].addEventListener("click", () => {
      stopReel(0);
    });

    stopButtons[1].addEventListener("click", () => {
      stopReel(1);
    });

    stopButtons[2].addEventListener("click", () => {
      stopReel(2);
    });

    document
      .getElementById("addCredit")
      .addEventListener("click", addCredit);

    document
      .getElementById("reset")
      .addEventListener("click", resetGame);

    drawAll();
    updateCounters();
    updateNormalDisplay();
  </script>
</body>
</html>
