<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ver0.6</title><style>body{background:#111;color:#fff;font-family:sans-serif;padding:20px}.card{background:#222;padding:16px;border-radius:12px;margin:12px 0}button{padding:12px 18px}</style></head><body><h1>東京喰種シミュレーター Ver.0.6 ベース</h1><div class="card">モード:<span id="mode">通常A</span><br>状態:<span id="state">通常</span><br>CZ:<span id="pt">0</span>/100</div><button onclick="spin()">レバーON</button><div class="card" id="log">待機中</div><script>let pt=0;const modes=["通常A","通常B","チャンス","高確"];function spin(){let r=Math.random(),t="ハズレ";if(r<0.08){t="レア役!精神世界";state.textContent="精神世界";pt+=35;}else if(r<0.18){t="東京上空";state.textContent="東京上空";pt+=15;}else{state.textContent="通常";}if(pt>=100){t+=" CZ突入!";pt=0;}ptEl.textContent=pt;mode.textContent=modes[Math.floor(Math.random()*4)];log.textContent=t;}const mode=document.getElementById("mode"),state=document.getElementById("state"),ptEl=document.getElementById("pt"),log=document.getElementById("log");</script></body></html>
